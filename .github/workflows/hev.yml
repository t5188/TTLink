name: Build Hev-Socks5-Tunnel Android

on:
  workflow_dispatch: # 允许你随时在自己的仓库手动点击按钮触发编译

jobs:
  build-android:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # 定义需要编译的 Android 架构
        arch: [arm, arm64, x86, x86_64]

    steps:
    # 第一步：不再拉取你自己的代码，而是直接拉取目标仓库的代码
     Pentest/Checkout Target Code
    - name: Clone Target Repository
      uses: actions/checkout@v4
      with:
        repository: 'heiher/hev-socks5-tunnel' # 目标仓库
        ref: 'main' # 或者你想编译的分支/标签，比如 'master' 或 'v2.0.0'
        submodules: recursive # 确保拉取可能存在的子模块

    - name: Setup Go Environment
      uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - name: Setup Android NDK
      uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r25c
        add-to-path: true

    - name: Build Binary
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        mkdir -p output
        
        # 映射架构名称
        if [ "${{ matrix.arch }}" = "arm" ]; then
          export GOARCH=arm
          export GOARM=7
          export ANDROID_ARCH=arm
        elif [ "${{ matrix.arch }}" = "arm64" ]; then
          export GOARCH=arm64
          export ANDROID_ARCH=arm64
        elif [ "${{ matrix.arch }}" = "x86" ]; then
          export GOARCH=386
          export ANDROID_ARCH=x86
        elif [ "${{ matrix.arch }}" = "x86_64" ]; then
          export GOARCH=amd64
          export ANDROID_ARCH=x86_64
        fi
        
        export GOOS=android
        export CGO_ENABLED=1
        
        # 定位 NDK 交叉编译器
        CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/${ANDROID_ARCH}-linux-android29-clang
        if [ "${{ matrix.arch }}" = "arm" ]; then
          CC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi29-clang
        fi
        
        # 执行 Go 编译
        CC=$CC go build -ldflags "-w -s" -o output/hev-socks5-tunnel-android-${{ matrix.arch }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: hev-socks5-tunnel-android-${{ matrix.arch }}
        path: output/hev-socks5-tunnel-android-${{ matrix.arch }}
        
